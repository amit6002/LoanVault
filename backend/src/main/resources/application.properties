# =============================================================
# LOANVAULT — APPLICATION CONFIGURATION
# Copy this to application.properties and fill in your values.
# For local dev: fill in directly in application-local.properties.
# For production (Railway): set as Environment Variables instead.
# =============================================================

spring.application.name=loanvault-backend
server.port=${PORT:8080}

# =============================================================
# POSTGRESQL DATABASE — Neon Cloud Connection
# Get this from: https://console.neon.tech → Your Project → Connection String
# Format: jdbc:postgresql://<host>/<dbname>?sslmode=require
# =============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =============================================================
# JPA / HIBERNATE CONFIGURATION
# ddl-auto options: update (safe for dev), validate (prod), create-drop (testing)
# =============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================
# JWT SECURITY CONFIGURATION
# Secret must be at least 64 characters (512 bits) for HS512 algorithm
# Expire time in milliseconds: 86400000 = 24 hours
# =============================================================
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWxvYW52YXVsdC1iYWNrZW5kLXByb2R1Y3Rpb24tZGVwbG95bWVudC1rZXktc3RyaW5nLTUxMi1iaXRz}
app.jwt.expiration-ms=86400000

# =============================================================
# GMAIL SMTP EMAIL GATEWAY (OTP Delivery)
# Requires App Password from: Google Account → Security → 2-Step Verification → App Passwords
# =============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM}

# =============================================================
# GOOGLE OAUTH2 CLIENT CONFIGURATION
# Get these from: Google Cloud Console → APIs & Services → Credentials → OAuth 2.0 Client IDs
# Set Authorized Redirect URI to: http://localhost:8080/login/oauth2/code/google
# =============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile,openid
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

# Frontend redirect URL after successful Google login
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
