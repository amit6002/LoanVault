# =============================================================
# LOANVAULT — APPLICATION CONFIGURATION
# Copy this to application.properties and fill in your values.
# For local dev: fill in directly in application-local.properties.
# For production (Railway): set as Environment Variables instead.
# =============================================================

spring.application.name=loanvault-backend
server.port=${PORT:8080}

# =============================================================
# POSTGRESQL DATABASE — Neon Cloud Connection
# Format: jdbc:postgresql://<host>/<dbname>?sslmode=require
# =============================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-round-sky-azvkt6ds-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_gSR4tLbD9wJu}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =============================================================
# JPA / HIBERNATE CONFIGURATION
# ddl-auto options: update (safe for dev), validate (prod), create-drop (testing)
# =============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Execute schema.sql automatically to patch missing DB columns (e.g. active, on_leave)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

