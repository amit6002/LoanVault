# =============================================================
# LOANVAULT — APPLICATION CONFIGURATION
# Copy this to application.properties and fill in your values.
# For local dev: fill in directly.
# For production (Railway): set as Environment Variables instead.
# =============================================================

spring.application.name=loanvault-backend
server.port=8080

# =============================================================
# POSTGRESQL DATABASE — Neon Cloud Connection
# Get this from: https://console.neon.tech → Your Project → Connection String
# Format: jdbc:postgresql://<host>/<dbname>?sslmode=require
# =============================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/loanvault}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =============================================================
# JPA / HIBERNATE
# create-drop: recreate tables on every start (dev only)
# validate: check schema matches entities (staging)
# none: do nothing (production — use Flyway/Liquibase instead)
# =============================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =============================================================
# JWT CONFIGURATION
# Generate a strong secret: openssl rand -base64 64
# Must be at least 512 bits (64 chars) for HS512
# =============================================================
jwt.secret=${JWT_SECRET:YourSuperSecretKeyForLoanVaultApplicationMinimum64CharactersLong12345}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# 86400000 ms = 24 hours

# =============================================================
# GOOGLE OAUTH2
# 1. Go to: https://console.cloud.google.com
# 2. Create project → APIs & Services → Credentials
# 3. Create OAuth 2.0 Client ID (Web application)
# 4. Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
#    (For production add: https://your-railway-url/login/oauth2/code/google)
# =============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# =============================================================
# SPRING MAIL — Gmail SMTP for OTP Emails
# 1. Use your Gmail account
# 2. Enable 2FA on Google Account
# 3. Go to: myaccount.google.com → Security → App Passwords
# 4. Generate App Password for "Mail" → use that 16-char password below
# =============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-gmail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# From address shown in OTP emails
mail.from.address=${MAIL_FROM:your-gmail@gmail.com}
mail.from.name=LoanVault

# =============================================================
# OTP CONFIGURATION
# =============================================================
otp.expiry-minutes=10
otp.length=6

# =============================================================
# FRONTEND URL — for CORS and OAuth2 redirect
# =============================================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# =============================================================
# LOGGING
# =============================================================
logging.level.com.loanvault=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
